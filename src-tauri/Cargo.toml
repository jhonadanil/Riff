[package]
name = "riff"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "riff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rtrb = "0.4.1"
# Alojar plugins VST3 (inserts de la señal de entrada: amplis, pedales…)
vst3-host = { version = "0.11.1", default-features = false }
# Entrada MIDI (controladores como la Maschine)
midir = "0.11"

# ASIO (baja latencia en Windows). Compilarlo necesita LLVM (libclang);
# el ASIO SDK lo descarga cpal solo, o se indica con CPAL_ASIO_DIR.
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18.2", features = ["asio"] }
# Bombear los mensajes de las ventanas de los plugins (la librería de VST3 no lo hace en Windows)
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Foundation"] }

[target.'cfg(not(windows))'.dependencies]
cpal = "0.18.2"

# cpal 0.18.2 (ASIO) suma timestamps que pueden desbordar; en debug eso hace
# panic dentro del callback de ASIO y mata el proceso. En release simplemente
# da la vuelta, así que se desactivan los overflow-checks solo para cpal.
[patch.crates-io]
vst3-host = { path = "vendor/vst3-host" }

[profile.dev.package.cpal]
overflow-checks = false

[profile.dev.package.asio-sys]
overflow-checks = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
