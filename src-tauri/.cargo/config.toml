# The project used to live in a path with an accent ("app-musica" with u-acute) and
# the ASIO build (asio-sys/bindgen) broke on it, so we compile into a plain-ASCII folder.
[build]
target-dir = "C:/Users/jhony/.riff-target"

# libclang to generate the ASIO bindings (LLVM installed with winget)
[env]
LIBCLANG_PATH = "C:/Program Files/LLVM/bin"
